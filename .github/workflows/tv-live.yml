name: Update live TV list
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tv/index.html", "tv/update-live.mjs", ".github/workflows/tv-live.yml"]
permissions:
  contents: write
concurrency:
  group: tv-live
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tv/update-live.mjs
      - name: Commit if changed
        run: |
          git config user.name "tv-live-bot"
          git config user.email "tv-live-bot@users.noreply.github.com"
          # commit only when the live list or a channel's status changed (not just the timestamp)
          if [ "$(git show HEAD:tv/live.json | jq -cS '{live,status}')" = "$(jq -cS '{live,status}' tv/live.json)" ]; then echo "no real change"; exit 0; fi
          git add tv/live.json
          git commit -m "tv: update live channels"
          git pull --rebase -q origin main
          git push
